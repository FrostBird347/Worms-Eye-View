# Automatically build the project and run any configured tests for every release and submitted pull request.

name: build
run-name: build ${{ inputs.refToBuild || github.sha }}
on:
  release:
    types: [published]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      refToBuild:
        description: 'Branch, tag or commit SHA1 to build'
        required: true
        type: string
jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [21] # Current Java LTS & minimum supported by Minecraft
        # and run on both Linux and Windows
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
        with: # uncomment to build for a specific commit
          ref: ${{ inputs.refToBuild }}
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: gradle
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' && matrix.java == '21' }} # Only upload artifacts built on one OS
        uses: actions/upload-artifact@v5
        with:
          name: Artifacts
          path: build/libs/
